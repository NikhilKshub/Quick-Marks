<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Marks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quick Marks</h1>
        <span id="levelText"></span>
        <span id="xpText"></span>
    </header>

    <section id="home">
        <h2>Pick a paper</h2>
        <p>Three ways to get faster at mental maths.</p>
        <button id="survivalBtn" class="gameCard">
            <strong>Survival</strong>
            <span>One wrong answer ends the run</span>
            <span>Best: <b id="survivalBest">0</b></span>
        </button>

        <button id="timeAttackBtn" class="gameCard">
            <strong>Time Attack</strong>
            <span>Answer as many as you can</span>
            <span>Best: <b id="timeAttackBest">0</b></span>
        </button>

        <button id="puzzleBtn" class="gameCard">
            <strong>Equation Puzzle</strong>
            <span>Fill the boxes to make it true</span>
            <span>Best: <b id="puzzleBest">0</b></span>
        </button>
    </section>

    <section id="setup">
        <h2 id="setupTitle">Setup</h2>
        <label><input type="radio" name="difficulty" value="easy">Easy</label>
        <label><input type="radio" name="difficulty" value="medium" checked>Medium</label>
        <label><input type="radio" name="difficulty" value="hard">Hard</label>

        <div id="timeOptions">
            <label><input type="radio" name="time" value="40">40 sec</label>
            <label><input type="radio" name="time" value="60" checked>60 sec</label>
            <label><input type="radio" name="time" value="120">2min</label>
            <input type="number" id="customTime" placeholder="Custom seconds" min="10" max="300">
        </div>
        <button id="startBtn">Start</button>
        <button id="backHome">Back</button>
    </section>
    
    <section id="survival">
        <h2>Survival</h2>
    </section>
    
    <section id="timeAttack">
        <h2>Time Attack</h2>
    </section>
    
    <section id="puzzle">
        <h2>Puzzle</h2>
    </section>
    
    <section id="result">
        <h2>Result</h2>
        <div id="timerBar">
            <div id="timerFill"></div>
        </div>
        <p>Time: <b id="timeText">10</b></p>
        <p>Score: <b id="scoreText">0</b></p>
        <p id="questionText"></p>
        <div id="optionsBox">
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
        </div>
    </section>






    <script src="script.js"></script>
</body>




</html>
