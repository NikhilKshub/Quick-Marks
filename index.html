<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Marks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:ital,wght@0,400..900;1,400..900&family=Young+Serif&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Quick Marks</h1>
        <span id="levelText"></span>
        <span id="xpText"></span>
    </header>

    <section id="home">
        <h2>Pick a paper</h2>
        <p>Three ways to get faster at mental maths.</p>
        <button id="survivalBtn" class="gameCard">
            <strong>Survival</strong>
            <span>One wrong answer ends the run</span>
            <span>Best: <b id="survivalBest">0</b></span>
        </button>

        <button id="timeAttackBtn" class="gameCard">
            <strong>Time Attack</strong>
            <span>Answer as many as you can</span>
            <span>Best: <b id="timeAttackBest">0</b></span>
        </button>

        <button id="puzzleBtn" class="gameCard">
            <strong>Equation Puzzle</strong>
            <span>Fill the boxes to make it true</span>
            <span>Best: <b id="puzzleBest">0</b></span>
        </button>
    </section>

    <section id="setup">
        <h2 id="setupTitle">Setup</h2>
        <p id="ruleText" class="rule"></p>
        <p class="label">Difficulty</p>
        <div class="choices">
            <label class="choice">
                <input type="radio" name="difficulty" value="easy">
                <span>Easy</span>
            </label>

            <label class="choice">
                <input type="radio" name="difficulty" value="medium" checked>
                <span>Medium</span>
            </label>

            <label class="choice">
                <input type="radio" name="difficulty" value="hard">
                <span>Hard</span>
            </label>
        </div>
        <div id="timeOptions">
            <p class="label">Time</p>
            <div class="choices">
                <label class="choice">
                    <input type="radio" name="time" value="40">
                    <span>40 sec</span>
                </label>

                <label class="choice">
                    <input type="radio" name="time" value="60" checked>
                    <span>60 sec</span>
                </label>

                <label class="choice">
                    <input type="radio" name="time" value="120">
                    <span>2 min</span>
                </label>
            </div>
            <input type="number" id="customTime" placeholder="Custom seconds" min="10" max="300">
        </div>
        <div class="buttonRow">
            <button id="startBtn" class="mainBtn">Start</button>
            <button id="backHome" class="plainBtn">Back</button>
        </div>
    </section>
    
    <section id="survival">
        <h2>Survival</h2>
        <div class="timerBar">
            <div id="timerFill" class="timerFill"></div>
        </div>
        <div class="stats">
            <p>Time: <b id="timeText">5</b></p>
            <p>Score: <b id="scoreText">0</b></p>
        </div>
        <p id="questionText" class="question"></p>
        <div class="optionsBox">
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
        </div>
    </section>
    
    <section id="timeAttack">
        <h2>Time Attack</h2>
        <div class="timerBar">
            <div id="attackFill" class="timerFill"></div>
        </div>
        <div class="stats">
            <p>Time: <b id="attackTimeText">60</b></p>
            <p>Score: <b id="attackScoreText">0</b></p>
        </div>

        <p id="attackQuestion" class="question"></p>
        <div class="optionsBox">
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
            <button class="option"></button>
        </div>
    </section>
    
    <section id="puzzle">
        <h2>Puzzle</h2>
        <div class="stats">
            <p>Time: <b id="puzzleTimeText">0</b></p>
            <p>Solved: <b id="puzzleScoreText">0</b> / 3</p>
        </div>

        <div id="equations">
            <div class="equation">
                <button class="box"></button>
                <span class="op"></span>
                <button class="box"></button>
                <span>=</span>
                <span class="result"></span>
            </div>

            <div class="equation">
                <button class="box"></button>
                <span class="op"></span>
                <button class="box"></button>
                <span>=</span>
                <span class="result"></span>
            </div>

            <div class="equation">
                <button class="box"></button>
                <span class="op"></span>
                <button class="box"></button>
                <span>=</span>
                <span class="result"></span>
            </div>

            <div class="equation">
                <button class="box"></button>
                <span class="op"></span>
                <button class="box"></button>
                <span>=</span>
                <span class="result"></span>
            </div>

            <div class="equation">
                <button class="box"></button>
                <span class="op"></span>
                <button class="box"></button>
                <span>=</span>
                <span class="result"></span>
            </div>
        </div>

        <div id="tiles">
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
            <div class="tile" draggable="true"></div>
        </div>

        <div class="buttonRow">
            <button id="skipBtn" class="plainBtn">Skip board</button>
        </div>
    </section>
    
    
    <section id="result">
        <h2>Result</h2>
        <p id="resultLabel" class="label">Your Score</p>
        <p id="resultScore">0</p>
        <p id="resultMessage"></p>
        <div class="buttonRow">
            <button id="playAgain" class="mainBtn">Play again</button>
            <button id="resultHome" class="plainBtn">Home</button>
        </div>
    </section>






    <script src="script.js"></script>
</body>
</html>
